name: Add issues to team project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest

    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/INAF-Schedulers/projects/5
          github-token: ${{ secrets.PROJECT_TOKEN }}
